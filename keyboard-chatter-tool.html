<!doctype html>
<meta charset="utf-8">
<title>Key chatter test</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; margin: 2rem; }
  #log { margin-top: 1rem; }
  .row { padding: 2px 0; }
  .chatter { background: #ffdddd; font-weight: bold; }
  #summary { margin-top: 1rem; white-space: pre; }
  kbd { border: 1px solid #999; border-radius: 3px; padding: 0 4px; }
</style>
<h2>Key chatter test</h2>
<p>Click here, then hammer the suspect keys ~50 times each.
Presses of the same key within <span id="thresholdLabel"></span> ms are flagged red.</p>
<p>Threshold <input id="threshold" type="number" value="100" min="5" max="500" style="width:5em">
<button id="reset">Reset</button></p>
<div id="summary"></div>
<div id="log"></div>
<script>
  const chatterThresholdMilliseconds = () => Number(document.getElementById('threshold').value);
  const lastPressTimeByKey = new Map();
  const chatterCountByKey = new Map();
  const pressCountByKey = new Map();
  const logElement = document.getElementById('log');
  const summaryElement = document.getElementById('summary');

  document.getElementById('thresholdLabel').textContent = chatterThresholdMilliseconds();
  document.getElementById('threshold').addEventListener('input', () => {
    document.getElementById('thresholdLabel').textContent = chatterThresholdMilliseconds();
  });

  function renderSummary() {
    const lines = [...pressCountByKey.entries()]
      .map(([key, presses]) => [key, presses, chatterCountByKey.get(key) || 0])
      .sort((a, b) => b[2] - a[2])
      .map(([key, presses, chatters]) => `${key.padEnd(12)} presses ${String(presses).padStart(4)}   chatter ${String(chatters).padStart(4)}`);
    summaryElement.textContent = lines.join('\n');
  }

  document.addEventListener('keydown', event => {
    event.preventDefault();
    // OS auto-repeat sets event.repeat; real switch chatter does not, so held keys are not miscounted.
    if (event.repeat) return;

    const key = event.code;
    const now = event.timeStamp;
    const previous = lastPressTimeByKey.get(key);
    const delta = previous === undefined ? null : now - previous;
    lastPressTimeByKey.set(key, now);
    pressCountByKey.set(key, (pressCountByKey.get(key) || 0) + 1);

    const isChatter = delta !== null && delta < chatterThresholdMilliseconds();
    if (isChatter) chatterCountByKey.set(key, (chatterCountByKey.get(key) || 0) + 1);

    const row = document.createElement('div');
    row.className = 'row' + (isChatter ? ' chatter' : '');
    row.textContent = `${key}  ${delta === null ? '-' : delta.toFixed(1) + ' ms'}${isChatter ? '   <-- CHATTER' : ''}`;
    logElement.prepend(row);
    renderSummary();
  });

  document.getElementById('reset').addEventListener('click', () => {
    lastPressTimeByKey.clear();
    chatterCountByKey.clear();
    pressCountByKey.clear();
    logElement.textContent = '';
    summaryElement.textContent = '';
  });
</script>
